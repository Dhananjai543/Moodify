AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Moodify - Voice-to-Playlist Generator Backend

Parameters:
  SpotifyClientId:
    Type: String
    Description: Spotify OAuth Client ID
  SpotifyClientSecret:
    Type: String
    Description: Spotify OAuth Client Secret
    NoEcho: true

Globals:
  Function:
    Timeout: 90
    MemorySize: 256
    Runtime: python3.12
    # Optimized: Graviton2 (arm64) offers ~20% better price-performance for Python
    Architectures:
      - arm64
    Environment:
      Variables:
        SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
        SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
        SPOTIFY_REDIRECT_URI: "http://127.0.0.1:5173/callback"
        BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"
        AWS_BEDROCK_REGION: "us-east-1"
        # Optimized: enables TCP keep-alive on all boto3 clients globally
        AWS_SDK_TCP_KEEPALIVE: "true"

Resources:
  MoodifyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
      CorsConfiguration:
        AllowOrigins:
          - http://127.0.0.1:5173
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/hello.handler
      CodeUri: .
      Description: Health check endpoint
      Events:
        HelloApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MoodifyApi
            Path: /hello
            Method: GET

  TokenExchangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth.token_handler
      CodeUri: .
      Description: Exchange auth code for Spotify tokens
      Events:
        TokenApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MoodifyApi
            Path: /auth/token
            Method: POST

  TokenRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth.refresh_handler
      CodeUri: .
      Description: Refresh Spotify access token
      Events:
        RefreshApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MoodifyApi
            Path: /auth/refresh
            Method: POST

  CreatePlaylistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/playlist.create_playlist_handler
      CodeUri: .
      Description: Search Spotify and collect track URIs
      # Optimized: more CPU/network bandwidth for parallel Spotify API calls
      MemorySize: 512
      Events:
        CreatePlaylistApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MoodifyApi
            Path: /create-playlist
            Method: POST

  AnalyzeMoodFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/mood.analyze_mood_handler
      CodeUri: .
      Description: Analyze mood via Amazon Bedrock
      # Optimized: more CPU for Bedrock response parsing and JSON processing
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
      Events:
        AnalyzeMoodApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MoodifyApi
            Path: /analyze-mood
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${MoodifyApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
